<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58cc02" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#ff9600" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#grad)" />
  <!-- Hand sign wave / ILY symbol simplified -->
  <g fill="#ffffff" transform="translate(14, 16)">
    <!-- Thumb -->
    <path d="M12 40 C6 38 6 28 12 24 C16 22 22 26 22 34 Z" fill="#ffffff" />
    <!-- Index Finger -->
    <rect x="22" y="8" width="8" height="34" rx="4" />
    <!-- Middle Finger folded -->
    <rect x="32" y="24" width="8" height="18" rx="4" />
    <!-- Ring Finger folded -->
    <rect x="42" y="25" width="8" height="17" rx="4" />
    <!-- Pinky Finger upright -->
    <rect x="52" y="14" width="8" height="28" rx="4" />
    <!-- Palm -->
    <path d="M18 36 L58 36 C64 42 62 60 48 64 L26 64 C16 60 14 44 18 36 Z" />
    <!-- Little heart in palm -->
    <path d="M36 44 C34 40 28 42 30 46 C32 50 36 53 36 53 C36 53 40 50 42 46 C44 42 38 40 36 44 Z" fill="url(#heartGrad)" />
  </g>
</svg>
